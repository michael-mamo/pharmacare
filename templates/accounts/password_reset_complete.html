{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Password Updated" %}{% endblock %}
{% block body %}
<div class="auth-shell">
    <div class="auth-visual">
        <div class="pill-pattern"></div>
        <div class="brand-mark mb-4">PC</div>
        <h1 class="brand-font display-6 mb-3" style="color:#fff;">{% trans "All set!" %}</h1>
    </div>
    <div class="auth-form-side">
        <div class="auth-card text-center">
            <i class="fa-solid fa-circle-check fa-3x text-warning mb-3"></i>
            <h3 class="brand-font mb-2">{% trans "Password updated" %}</h3>
            <p class="text-muted">{% trans "Your password has been changed successfully. You can now sign in." %}</p>
            <a href="{% url 'accounts:login' %}" class="btn btn-brand mt-3">{% trans "Sign In" %}</a>
        </div>
    </div>
</div>
{% endblock %}
