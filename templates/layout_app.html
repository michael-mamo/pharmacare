{% extends "base.html" %}
{% load i18n %}
{% block body %}
<div class="app-shell">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    {% include "partials/sidebar.html" %}

    <div class="main-content">
        <header class="topbar">
            <div class="d-flex align-items-center gap-2 gap-md-3">
                <button class="btn-icon d-lg-none" id="sidebarToggle" aria-label="{% trans 'Open menu' %}">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="d-none d-md-block">
                    <div class="breadcrumb-eyebrow">{{ PHARMACY_NAME }}</div>
                    <h5 class="mb-0 brand-font">{% block page_heading %}{% trans "Dashboard" %}{% endblock %}</h5>
                </div>
            </div>

            <div class="d-flex align-items-center gap-2 gap-md-3">
                {% include "partials/navbar_actions.html" %}
            </div>
        </header>

        <main class="page-body">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>
{% endblock %}
